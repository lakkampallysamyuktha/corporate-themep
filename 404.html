<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>404 - Page Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    .box {
      padding: 20px;
    }

    h1 {
      font-size: 80px;
      margin: 0;
    }

    h2 {
      margin: 10px 0;
      font-weight: 600;
    }

    p {
      color: #cbd5f5;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      color: white;
      margin: 5px;
      transition: 0.3s;
    }

    .home-btn {
      background: #ef4444;
    }

    .back-btn {
      background: #3b82f6;
      border: none;
      cursor: pointer;
    }

    .btn:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>404</h1>
    <h2>Oops! Page Not Found</h2>
    <p>This feature is not available yet.</p>

    <a href="index.html" class="btn home-btn">🏠 Back to Home</a>
    <button onclick="history.back()" class="btn back-btn">⬅ Go Back</button>
  </div>

</body>
</html>
